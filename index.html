<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Weather App</title>
    <link rel="stylesheet" href="styles.css">
  </head>
<body>
  <div class="controls">
    <select id="city-selector" name="cities">
      <option value="" disabled selected>Wybierz miasto...</option> 
      <option value="new york">New York</option>
      <option value="los angeles">Los Angeles</option>
      <option value="chicago">Chicago</option>
      <option value="paris">Paris</option>
      <option value="tokyo">Tokyo</option>
      <option value="london">London</option>
    </select>
    <button id="get-weather-btn">Pokaż pogodę</button>
  </div>

  <div id="weather-info">
     <img id="weather-icon" hidden>
     <div id="main-temperature" hidden></div> 
     <div id="feels-like" hidden></div> 
     <div id="humidity" hidden></div> 
     <div id="wind" hidden></div> 
     <div id="wind-gust" hidden></div> 
     <div id="weather-main" hidden></div> 
     <div id="location" hidden></div> 
  </div> 
  <script src="script.js"></script>
</body>
</html>
