<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Wyszukiwarka Filmów</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>🎬 MovieFinder</h1>
        <div class="search-box">
            <input type="text" id="movie-input" placeholder="Wpisz tytuł filmu (np. Pulp Fiction)...">
            <button id="search-btn">Szukaj</button>
        </div>
    </header>

    <main id="movies-grid"></main>

    <div id="modal" class="modal-overlay hidden">
        <div class="modal-content">
            <span id="close-modal" class="close-btn">&times;</span>
            <div id="modal-body">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
